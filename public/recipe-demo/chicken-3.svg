<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Sear skin-side down in the cast iron under a weight">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EF"/><stop offset="1" stop-color="#F3E7D6"/>
    </linearGradient>
    <radialGradient id="heat3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0A93C"/><stop offset="1" stop-color="#B4472E"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <ellipse cx="400" cy="440" rx="300" ry="34" fill="#000" opacity="0.05"/>
  <!-- cast iron skillet -->
  <ellipse cx="400" cy="360" rx="210" ry="70" fill="#2E2A28"/>
  <ellipse cx="400" cy="350" rx="210" ry="70" fill="#3A3532"/>
  <ellipse cx="400" cy="346" rx="176" ry="52" fill="#242120"/>
  <rect x="600" y="336" width="150" height="26" rx="13" fill="#3A3532"/>
  <rect x="600" y="336" width="150" height="26" rx="13" fill="#000" opacity="0.15"/>
  <!-- chicken searing skin-side down -->
  <path d="M270 344 q60 -54 132 -50 q92 4 128 46 q-64 22 -132 22 q-72 0 -128 -18z" fill="#C6702B"/>
  <path d="M280 342 q58 -40 120 -38 q78 2 112 34 q-60 10 -120 10 q-70 0 -112 -6z" fill="#A85A22"/>
  <!-- press weight on top -->
  <rect x="300" y="250" width="200" height="46" rx="12" fill="#8A8580"/>
  <rect x="300" y="250" width="200" height="16" rx="8" fill="#A8A39C"/>
  <rect x="382" y="214" width="36" height="44" rx="10" fill="#6E6964"/>
  <ellipse cx="400" cy="210" rx="34" ry="12" fill="#8A8580"/>
  <!-- heat glow + sizzle -->
  <ellipse cx="400" cy="420" rx="150" ry="24" fill="url(#heat3)" opacity="0.5"/>
  <g stroke="#C88B3A" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M250 300 q-10 -22 6 -40"/>
    <path d="M540 296 q12 -22 -4 -42"/>
  </g>
  <text x="400" y="474" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#8A6A4A">Sear skin-down, pressed, to deep gold</text>
</svg>
