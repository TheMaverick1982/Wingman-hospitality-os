<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Wipe the rims, garnish, and call the runner">
  <defs>
    <linearGradient id="tbg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EF"/><stop offset="1" stop-color="#F3E7D6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#tbg4)"/>
  <!-- finished plate -->
  <ellipse cx="340" cy="290" rx="200" ry="126" fill="#FFFFFF"/>
  <ellipse cx="340" cy="290" rx="200" ry="126" fill="#000" opacity="0.04"/>
  <ellipse cx="340" cy="290" rx="150" ry="92" fill="#FBFAF7"/><ellipse cx="340" cy="290" rx="150" ry="92" fill="none" stroke="#EAE2D4" stroke-width="3"/>
  <ellipse cx="316" cy="300" rx="52" ry="28" fill="#6E7A4B"/>
  <ellipse cx="378" cy="284" rx="36" ry="20" fill="#C98A5A"/>
  <circle cx="348" cy="266" r="6" fill="#E0A63C"/>
  <!-- garnish sprig -->
  <g stroke="#6E7A4B" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M360 250 q16 -14 34 -14"/>
    <path d="M370 246 l-2 -10"/><path d="M382 244 l-1 -11"/><path d="M394 240 l2 -10"/>
  </g>
  <!-- sparkle (clean rim) -->
  <path d="M470 210 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4z" fill="#E0A63C"/>
  <!-- service bell to call runner -->
  <g transform="translate(600 250)">
    <ellipse cx="60" cy="120" rx="70" ry="16" fill="#000" opacity="0.06"/>
    <path d="M10 110 q0 -76 50 -76 q50 0 50 76z" fill="#C05640"/>
    <path d="M10 110 q0 -76 50 -76 q50 0 50 76z" fill="#B4472E" opacity="0.35"/>
    <rect x="6" y="108" width="108" height="14" rx="7" fill="#8A3A2A"/>
    <rect x="52" y="18" width="16" height="18" rx="5" fill="#8A3A2A"/>
    <circle cx="60" cy="16" r="10" fill="#E0A63C"/>
    <g stroke="#E0A63C" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M128 60 q14 4 20 18"/><path d="M-8 60 q-14 4 -20 18"/>
    </g>
  </g>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#8A6A4A">Wipe rims, final garnish — call the runner</text>
</svg>
