<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Plate over confit potato with lemon-thyme jus">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EF"/><stop offset="1" stop-color="#F3E7D6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg5)"/>
  <ellipse cx="400" cy="300" rx="250" ry="150" fill="#FFFFFF"/>
  <ellipse cx="400" cy="300" rx="250" ry="150" fill="#000" opacity="0.04"/>
  <ellipse cx="400" cy="300" rx="196" ry="116" fill="#FBFAF7"/>
  <ellipse cx="400" cy="300" rx="196" ry="116" fill="none" stroke="#EAE2D4" stroke-width="3"/>
  <!-- jus pooled -->
  <ellipse cx="400" cy="336" rx="150" ry="52" fill="#8A5A2E" opacity="0.5"/>
  <!-- confit potato -->
  <ellipse cx="330" cy="322" rx="60" ry="34" fill="#EAD9A8"/>
  <ellipse cx="330" cy="316" rx="60" ry="30" fill="#F2E6BE"/>
  <!-- half chicken, crisp -->
  <path d="M300 300 q70 -66 150 -60 q96 6 120 46 q-64 30 -150 30 q-84 0 -120 -16z" fill="#C6702B"/>
  <path d="M312 292 q64 -48 138 -44 q80 4 104 34 q-58 16 -138 16 q-74 0 -104 -6z" fill="#DA8B3B"/>
  <ellipse cx="360" cy="276" rx="28" ry="12" fill="#EBA956" opacity="0.7"/>
  <!-- drumstick bone -->
  <rect x="470" y="268" width="46" height="14" rx="7" fill="#FBEFDD" transform="rotate(-16 493 275)"/>
  <circle cx="512" cy="260" r="9" fill="#FBEFDD"/>
  <!-- thyme garnish -->
  <g stroke="#6E7A4B" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M430 340 q20 -6 40 -2"/>
    <path d="M438 336 l-4 -8"/><path d="M450 338 l-3 -9"/><path d="M462 338 l-2 -9"/>
  </g>
  <!-- lemon zest dots -->
  <circle cx="300" cy="290" r="3" fill="#E0A63C"/><circle cx="420" cy="252" r="3" fill="#E0A63C"/>
  <circle cx="360" cy="330" r="3" fill="#E0A63C"/>
  <text x="400" y="474" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#8A6A4A">Rest, then plate over confit potato with jus</text>
</svg>
