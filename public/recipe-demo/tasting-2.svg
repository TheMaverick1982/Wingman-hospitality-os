<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Fire the courses in sequence off the pass">
  <defs>
    <linearGradient id="tbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EF"/><stop offset="1" stop-color="#F3E7D6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#tbg2)"/>
  <!-- the pass (stainless counter) -->
  <rect x="70" y="300" width="660" height="90" rx="12" fill="#CFC8BE"/>
  <rect x="70" y="300" width="660" height="26" rx="12" fill="#E2DCD2"/>
  <!-- heat lamp bar -->
  <rect x="120" y="120" width="560" height="16" rx="8" fill="#6E6964"/>
  <g fill="#E0A63C" opacity="0.85">
    <ellipse cx="220" cy="150" rx="26" ry="10"/><ellipse cx="400" cy="150" rx="26" ry="10"/><ellipse cx="580" cy="150" rx="26" ry="10"/>
  </g>
  <path d="M200 160 h40 l-20 60z" fill="#E0A63C" opacity="0.15"/>
  <path d="M380 160 h40 l-20 60z" fill="#E0A63C" opacity="0.15"/>
  <path d="M560 160 h40 l-20 60z" fill="#E0A63C" opacity="0.15"/>
  <!-- plates in a numbered row, courses 1..4 -->
  <g>
    <ellipse cx="200" cy="316" rx="60" ry="24" fill="#FFFFFF"/><ellipse cx="200" cy="313" rx="44" ry="16" fill="#F1EADD"/>
    <ellipse cx="200" cy="311" rx="20" ry="8" fill="#6E7A4B"/>
    <circle cx="200" cy="270" r="15" fill="#B4472E"/><text x="200" y="276" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">1</text>

    <ellipse cx="360" cy="316" rx="60" ry="24" fill="#FFFFFF"/><ellipse cx="360" cy="313" rx="44" ry="16" fill="#F1EADD"/>
    <ellipse cx="360" cy="311" rx="20" ry="8" fill="#C98A5A"/>
    <circle cx="360" cy="270" r="15" fill="#B4472E"/><text x="360" y="276" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">2</text>

    <ellipse cx="520" cy="316" rx="60" ry="24" fill="#FFFFFF"/><ellipse cx="520" cy="313" rx="44" ry="16" fill="#F1EADD"/>
    <ellipse cx="520" cy="311" rx="20" ry="8" fill="#E0A63C"/>
    <circle cx="520" cy="270" r="15" fill="#CBB9A0"/><text x="520" y="276" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">3</text>

    <ellipse cx="650" cy="318" rx="46" ry="18" fill="#FFFFFF"/><ellipse cx="650" cy="315" rx="32" ry="11" fill="#F1EADD"/>
    <circle cx="650" cy="278" r="14" fill="#CBB9A0"/><text x="650" y="283" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">4</text>
  </g>
  <text x="400" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#8A6A4A">Fire in sequence — one course complete before the next</text>
</svg>
