<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Season both sides with salt">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EF"/><stop offset="1" stop-color="#F3E7D6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <ellipse cx="400" cy="430" rx="300" ry="34" fill="#000" opacity="0.05"/>
  <!-- board -->
  <rect x="150" y="300" width="500" height="120" rx="18" fill="#C9A06A"/>
  <rect x="150" y="300" width="500" height="120" rx="18" fill="#000" opacity="0.06"/>
  <!-- chicken -->
  <ellipse cx="380" cy="292" rx="150" ry="80" fill="#EFB98A"/>
  <path d="M250 300 q60 -70 150 -66 q100 4 138 52 q-70 40 -150 40 q-90 0 -138 -26z" fill="#F4CDA6"/>
  <ellipse cx="330" cy="276" rx="30" ry="18" fill="#F8DDBE" opacity="0.7"/>
  <!-- hand pinching salt (simple) -->
  <path d="M360 90 q40 -20 70 6 q-6 26 -34 34 q-40 6 -36 -40z" fill="#F3C79E"/>
  <!-- salt falling -->
  <g fill="#FFFFFF" stroke="#E4D9C6" stroke-width="1">
    <rect x="372" y="150" width="6" height="6" rx="1" transform="rotate(20 375 153)"/>
    <rect x="392" y="176" width="6" height="6" rx="1" transform="rotate(-15 395 179)"/>
    <rect x="360" y="196" width="5" height="5" rx="1" transform="rotate(30 362 198)"/>
    <rect x="410" y="150" width="5" height="5" rx="1" transform="rotate(10 412 152)"/>
    <rect x="384" y="214" width="6" height="6" rx="1" transform="rotate(-25 387 217)"/>
    <rect x="418" y="196" width="5" height="5" rx="1" transform="rotate(18 420 198)"/>
    <rect x="350" y="168" width="5" height="5" rx="1" transform="rotate(-10 352 170)"/>
  </g>
  <!-- salt cellar -->
  <path d="M560 230 h90 l-12 60 h-66z" fill="#E7DBC6"/>
  <ellipse cx="605" cy="230" rx="45" ry="12" fill="#D8C9AE"/>
  <ellipse cx="605" cy="230" rx="32" ry="8" fill="#F4ECDD"/>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#8A6A4A">Season both sides evenly</text>
</svg>
