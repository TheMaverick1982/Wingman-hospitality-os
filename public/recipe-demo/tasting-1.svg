<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Mise en place with the hearth up to temperature">
  <defs>
    <linearGradient id="tbg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EF"/><stop offset="1" stop-color="#F3E7D6"/>
    </linearGradient>
    <radialGradient id="fire1" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#F6C463"/><stop offset="0.6" stop-color="#E0752C"/><stop offset="1" stop-color="#B4472E"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#tbg1)"/>
  <!-- hearth on the right -->
  <rect x="540" y="150" width="210" height="230" rx="16" fill="#5A524B"/>
  <rect x="560" y="210" width="170" height="150" rx="10" fill="#2E2A28"/>
  <path d="M600 350 q10 -60 44 -90 q-6 40 18 56 q26 -18 18 -60 q40 34 44 94z" fill="url(#fire1)"/>
  <path d="M628 350 q8 -34 24 -50 q-2 24 12 32 q14 -12 10 -34 q22 22 20 52z" fill="#F6D07A" opacity="0.9"/>
  <!-- logs -->
  <rect x="575" y="352" width="140" height="14" rx="7" fill="#7A5A2A"/>
  <!-- prep counter -->
  <rect x="60" y="330" width="470" height="70" rx="12" fill="#C9A06A"/>
  <rect x="60" y="330" width="470" height="70" rx="12" fill="#000" opacity="0.05"/>
  <!-- mise bowls -->
  <g>
    <ellipse cx="130" cy="330" rx="52" ry="20" fill="#E7DBC6"/><ellipse cx="130" cy="326" rx="44" ry="15" fill="#6E7A4B"/>
    <ellipse cx="240" cy="330" rx="52" ry="20" fill="#E7DBC6"/><ellipse cx="240" cy="326" rx="44" ry="15" fill="#B4472E"/>
    <ellipse cx="350" cy="330" rx="52" ry="20" fill="#E7DBC6"/><ellipse cx="350" cy="326" rx="44" ry="15" fill="#E0A63C"/>
    <ellipse cx="450" cy="330" rx="44" ry="17" fill="#E7DBC6"/><ellipse cx="450" cy="327" rx="36" ry="12" fill="#C98A5A"/>
  </g>
  <!-- thermometer / temp check card -->
  <rect x="120" y="180" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#EAE2D4" stroke-width="3"/>
  <text x="195" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#8A6A4A">Hearth</text>
  <text x="195" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#B4472E">READY</text>
  <text x="400" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#8A6A4A">Mise en place — every course prepped, hearth to temp</text>
</svg>
