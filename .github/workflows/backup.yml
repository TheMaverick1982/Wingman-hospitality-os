name: Nightly backup

# Independent, customer-controlled backup of the Supabase Postgres database and
# the Storage bucket to a Backblaze B2 bucket you own. This is deliberately
# separate from Supabase's own daily backups / PITR: it protects against a
# provider-level failure or account lockout, not just accidental deletes.
#
# Scheduled runs only begin once this file is on the repository's DEFAULT branch
# (GitHub only schedules workflows from the default branch). You can trigger a
# run by hand from the Actions tab at any time via "Run workflow".
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL          Postgres connection string (Session pooler, port 5432)
#   BACKUP_PASSPHRASE        Strong passphrase used to encrypt each dump
#   B2_KEY_ID                Backblaze application key ID
#   B2_APP_KEY               Backblaze application key
#   B2_BUCKET                Backblaze bucket name
# Optional (for Storage backup; skipped if unset):
#   SUPABASE_S3_ENDPOINT     e.g. https://<ref>.storage.supabase.co/storage/v1/s3
#   SUPABASE_S3_REGION       e.g. us-east-1 (shown in Storage -> S3 connection)
#   SUPABASE_S3_ACCESS_KEY   Storage S3 access key id
#   SUPABASE_S3_SECRET_KEY   Storage S3 secret access key

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily (~3-4am US Eastern)
  workflow_dispatch: {}

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install pg_dump 17, gpg, and rclone
        run: |
          set -euo pipefail
          # Small retry wrapper so a single transient network blip (e.g. a DNS or
          # TLS timeout fetching a key/script) doesn't skip a nightly backup.
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed; retrying in $((i*5))s"; sleep $((i*5)); done; return 1; }
          retry sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          retry bash -c 'curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg'
          retry sudo apt-get update
          retry sudo apt-get install -y postgresql-client-17 gnupg
          # rclone from the distro repo is reliable (same apt mirror) and new
          # enough for an S3/B2 upload; only fall back to the install script (with
          # retries) if the package isn't available. Previously this was a bare
          # `curl https://rclone.org/install.sh | bash`, whose single connection
          # timeout to rclone.org failed the whole backup.
          retry sudo apt-get install -y rclone \
            || retry bash -c 'curl -fsSL https://rclone.org/install.sh | sudo bash'
          rclone version
          # The runner ships an older pg_dump (v16) that wins in PATH; put the
          # freshly installed v17 client ahead of it so pg_dump matches the
          # Postgres 17 server (pg_dump refuses to dump a newer server).
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify pg_dump version
        run: pg_dump --version

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set." && exit 1
          fi
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Custom format (-Fc) so pg_restore can selectively restore and parallelize.
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --format=custom --file="db-$STAMP.dump"
          ls -lh "db-$STAMP.dump"

      - name: Encrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set." && exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "db-$STAMP.dump.gpg" "db-$STAMP.dump"
          rm -f "db-$STAMP.dump"
          ls -lh "db-$STAMP.dump.gpg"

      - name: Upload database backup to B2
        env:
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          rclone copy "db-$STAMP.dump.gpg" "B2:$B2_BUCKET/postgres/" --b2-hard-delete
          # Prune dumps older than 30 days (belt-and-suspenders alongside a B2
          # lifecycle rule).
          rclone delete "B2:$B2_BUCKET/postgres/" --min-age 30d --b2-hard-delete || true
          echo "Database backup uploaded: postgres/db-$STAMP.dump.gpg"

      - name: Back up Storage bucket to B2
        env:
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}
          RCLONE_CONFIG_SUPA_TYPE: s3
          RCLONE_CONFIG_SUPA_PROVIDER: Other
          RCLONE_CONFIG_SUPA_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          RCLONE_CONFIG_SUPA_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          RCLONE_CONFIG_SUPA_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_SUPA_ENDPOINT:-}" ]; then
            echo "Supabase S3 not configured (SUPABASE_S3_ENDPOINT unset) - skipping Storage backup."
            exit 0
          fi
          # copy (not sync) so files deleted in Supabase are retained in the
          # backup rather than being pruned to match the source.
          rclone copy "SUPA:ticket-attachments" "B2:$B2_BUCKET/storage/ticket-attachments" --fast-list
          echo "Storage backup complete."
