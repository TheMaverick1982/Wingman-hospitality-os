<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wingman</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a6cff; }
      .wrap {
        height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #ffffff;
      }
      .plane { width: 96px; height: 96px; }
      .msg { font-size: 15px; opacity: 0.85; }
      .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.35);
        border-top-color: #ffffff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!--
      Bundled fallback screen. In normal use the native shell loads the live
      site (server.url in capacitor.config.json); this shows briefly at launch
      and if the device is offline.
    -->

    </div>
  </body>
</html>
